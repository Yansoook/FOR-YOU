<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>СКУЧАЮ ПО ТЕБЕ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .container {
            text-align: center;
            max-width: 90%;
            z-index: 2;
        }

        .main-text {
            font-size: clamp(4rem, 12vw, 18rem);
            font-weight: 400;
            letter-spacing: 0.1em;
            opacity: 0.85;
            text-shadow: 
                0 0 20px rgba(255,255,255,0.1),
                0 0 40px rgba(255,255,255,0.05),
                2px 2px 10px rgba(0,0,0,0.8);
            animation: fadeInSlow 4s ease-out forwards;
            position: relative;
        }

        .main-text::before {
            content: '';
            position: absolute;
            top: -10%;
            left: -10%;
            right: -10%;
            bottom: -10%;
            background: linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.03) 50%, transparent 52%);
            animation: shimmer 6s infinite linear;
            pointer-events: none;
            z-index: -1;
        }

        /* Тонкий шум для текстуры */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 80%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 40%, rgba(0,0,0,0.3) 0%, transparent 50%);
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
            animation: subtleDrift 20s ease-in-out infinite;
        }

        @keyframes fadeInSlow {
            0% {
                opacity: 0;
                transform: translateY(50px) scale(0.95);
            }
            100% {
                opacity: 0.85;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) skewX(-20deg); }
            100% { transform: translateX(120%) skewX(-20deg); }
        }

        @keyframes subtleDrift {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(10px, -5px) rotate(0.5deg); }
        }

        /* Адаптивность для мобильных */
        @media (max-width: 480px) {
            .main-text {
                font-size: clamp(3rem, 18vw, 12rem);
                letter-spacing: 0.15em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-text">СКУЧАЮ ПО ТЕБЕ</div>
    </div>
</body>
</html>
